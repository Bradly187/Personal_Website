name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "index.html,product.html,docs.html,about.html,resume.html,style.css,resume.pdf,multi-agent-orchestration-on-aws.pdf,assets/,projects/,nids-dashboard/,sitemap.xml,robots.txt,404.html"
          target: "/var/www/html"
